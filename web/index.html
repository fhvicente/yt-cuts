<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yt-cuts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #ff3c3c;
      --accent2: #ff7043;
      --text: #f0f0f0;
      --muted: #888;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px 80px;
    }

    .container { width: 100%; max-width: 600px; }

    header { margin-bottom: 40px; }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 7px;
    }
    input[type="url"], input[type="number"], input[type="text"], select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

    button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      padding: 13px;
      margin-top: 4px;
      transition: opacity 0.15s, transform 0.1s;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* status */
    #status { display: none; }

    .status-running {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-error {
      background: #2a1010;
      border: 1px solid #5c1a1a;
      border-radius: var(--radius);
      color: #ff7070;
      font-size: 0.88rem;
      padding: 14px 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* results */
    #results { display: none; }
    #results h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .clip-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .clip-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      gap: 12px;
    }
    .clip-name {
      font-size: 0.88rem;
      color: var(--text);
      font-family: "SF Mono", "Fira Code", monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .clip-download {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .clip-download:hover { border-color: var(--accent); color: var(--accent); }

    .new-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.88rem;
      padding: 10px 18px;
      margin-top: 18px;
      transition: border-color 0.15s, color 0.15s;
    }
    .new-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>yt-cuts</h1>
      <p>Gera clips verticais 9:16 com legendas karaoke a partir de um vídeo do YouTube.</p>
    </header>

    <form id="form" class="card" autocomplete="off">
      <div class="field">
        <label>URL do YouTube</label>
        <input type="url" name="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required />
      </div>
      <div class="row">
        <div class="field">
          <label>Clips</label>
          <input type="number" name="clips" id="clips" value="10" min="1" max="30" />
        </div>
        <div class="field">
          <label>Idioma</label>
          <input type="text" name="idioma" id="idioma" value="pt" maxlength="5" />
        </div>
        <div class="field">
          <label>Duração</label>
          <select name="dur" id="dur">
            <option value="20-45">20–45s</option>
            <option value="30-60" selected>30–60s</option>
            <option value="45-90">45–90s</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>LLM para seleção de cortes</label>
        <select name="llm" id="llm">
          <option value="claude" selected>Claude (Anthropic)</option>
          <option value="openai">GPT-4o-mini (OpenAI)</option>
        </select>
      </div>
      <button type="submit" id="submit-btn">Gerar clips</button>
    </form>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const submitBtn = document.getElementById('submit-btn');
    let pollTimer = null;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearInterval(pollTimer);

      const [minDur, maxDur] = document.getElementById('dur').value.split('-').map(Number);
      const body = new FormData();
      body.append('url', document.getElementById('url').value.trim());
      body.append('clips', document.getElementById('clips').value);
      body.append('idioma', document.getElementById('idioma').value.trim());
      body.append('min_dur', minDur);
      body.append('max_dur', maxDur);
      body.append('llm', document.getElementById('llm').value);

      submitBtn.disabled = true;
      resultsEl.style.display = 'none';
      showRunning('A iniciar…');

      let res;
      try {
        res = await fetch('/jobs', { method: 'POST', body });
      } catch (err) {
        showError('Erro ao contactar o servidor: ' + err.message);
        submitBtn.disabled = false;
        return;
      }

      if (!res.ok) {
        showError('Erro do servidor: ' + res.status);
        submitBtn.disabled = false;
        return;
      }

      const { job_id } = await res.json();
      pollTimer = setInterval(() => poll(job_id), 2000);
    });

    async function poll(jobId) {
      let data;
      try {
        const res = await fetch(`/jobs/${jobId}`);
        data = await res.json();
      } catch { return; }

      if (data.status === 'running') {
        showRunning('A processar… (pode demorar 1–5 min)');
      } else if (data.status === 'done') {
        clearInterval(pollTimer);
        submitBtn.disabled = false;
        statusEl.style.display = 'none';
        showResults(data.results);
      } else if (data.status === 'error') {
        clearInterval(pollTimer);
        submitBtn.disabled = false;
        showError(data.error || 'Erro desconhecido.');
      }
    }

    function showRunning(msg) {
      statusEl.style.display = 'block';
      statusEl.innerHTML = `<div class="status-running"><div class="spinner"></div><span>${msg}</span></div>`;
    }

    function showError(msg) {
      statusEl.style.display = 'block';
      statusEl.innerHTML = `<div class="status-error">⚠ ${msg}</div>`;
    }

    function showResults(clips) {
      if (!clips || clips.length === 0) {
        statusEl.style.display = 'block';
        statusEl.innerHTML = `<div class="status-error">Nenhum clip gerado. Verifica a URL ou ajusta a duração.</div>`;
        return;
      }
      resultsEl.style.display = 'block';
      resultsEl.innerHTML = `
        <h2>${clips.length} clip${clips.length !== 1 ? 's' : ''} gerado${clips.length !== 1 ? 's' : ''}</h2>
        <ul class="clip-list">
          ${clips.map(c => `
            <li class="clip-item">
              <span class="clip-name">${c.name}</span>
              <a class="clip-download" href="${c.url}" download="${c.name}">Download</a>
            </li>
          `).join('')}
        </ul>
        <button class="new-btn" onclick="resetForm()">← Novo vídeo</button>
      `;
    }

    function resetForm() {
      resultsEl.style.display = 'none';
      statusEl.style.display = 'none';
      document.getElementById('url').value = '';
      document.getElementById('url').focus();
    }
  </script>
</body>
</html>
